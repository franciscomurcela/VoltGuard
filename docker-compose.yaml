services:

  # ═══════════════════════════════════════════════════════════════════════════
  # AUTH — Keycloak
  # ═══════════════════════════════════════════════════════════════════════════

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      # Note: KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD are deprecated in Keycloak 26+.
      # Using the new KC_BOOTSTRAP_ADMIN_* names now so the upgrade is a no-op.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://auth.voltguard.pt
      KC_HOSTNAME_ADMIN: https://auth.voltguard.pt
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./composer-service/infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      - voltguard-network
    healthcheck:
      # Keycloak's ubi9-micro image has no curl/wget, but /bin/sh is bash and
      # supports /dev/tcp redirects. We craft a minimal HTTP/1.0 request to the
      # management port (9000, exposed by KC_HEALTH_ENABLED=true) and grep for
      # a 200 in the status line — a real readiness check, not just "port open".
      # Reference: https://github.com/keycloak/keycloak/issues/32363
      test: ["CMD-SHELL", "{ printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3; } 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # VAULT — Secret Manager (dev mode)
  # ═══════════════════════════════════════════════════════════════════════════

  vault:
    image: hashicorp/vault:1.15
    command: server -dev -dev-root-token-id=dev-root -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - voltguard-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPOSITOR — Backend
  # ═══════════════════════════════════════════════════════════════════════════

  compositor-backend:
    build:
      context: ./composer-service/backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      NODE_ENV: production
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
      VAULT_SECRET_PATH: secret/data/compositor
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: iot-compositor
      KEYCLOAK_CLIENT_ID: compositor-backend
      OAM_SERVICE_URL: ${OAM_SERVICE_URL:-http://oam-service:8080}
      NOTIFICATION_SERVICE_URL: http://notifications-service:8083
      ANOMALY_SERVICE_URL: http://anomaly-api:8085
      PROXY_TIMEOUT_MS: 8000
      PROXY_RETRY_COUNT: 1
      PROXY_RETRY_DELAY_MS: 500
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 200
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: https://composer.voltguard.pt
      COMPOSITOR_CLIENT_ID: energy_composer
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      COMPOSER_BASE_URL: ${COMPOSER_BASE_URL:-http://compositor-backend:8080}
      ANOMALY_NOTIFY_USER_IDS: ${ANOMALY_NOTIFY_USER_IDS:-op_joao_silva,op_maria_costa}
      DIGEST_INTERVAL_MS: ${DIGEST_INTERVAL_MS:-3600000}
    volumes:
      - compositor-data:/app/data
    depends_on:
      vault:
        condition: service_started
      oam-service:
        condition: service_healthy
      anomaly-api:
        condition: service_healthy
      notifications-service:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # COMPOSITOR — Frontend
  # ═══════════════════════════════════════════════════════════════════════════

  compositor-frontend:
    build:
      context: ./composer-service/frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: https://auth.voltguard.pt
        VITE_AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      compositor-backend:
        condition: service_healthy
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS — Database
  # ═══════════════════════════════════════════════════════════════════════════

  notifications-db:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_password}
      MONGO_INITDB_DATABASE: notifications_db
    volumes:
      - notifications-db-data:/data/db
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' --quiet"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS — Service
  # ═══════════════════════════════════════════════════════════════════════════

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    environment:
      MONGODB_URL: mongodb://admin:${NOTIFICATIONS_DB_PASSWORD:-notifications_password}@notifications-db:27017
      MONGODB_DATABASE: notifications_db
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8083
      AUTH_TOKEN: ${NOTIFICATIONS_AUTH_TOKEN:-your_secure_auth_token}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      TWILIO_FROM_WHATSAPP: ${TWILIO_FROM_WHATSAPP:-}
      TWILIO_FROM_EMAIL: ${TWILIO_FROM_EMAIL:-alertasvoltguard@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-alertasvoltguard@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-alertasvoltguard@gmail.com}
      SEED_DEFAULT_PREFERENCES: ${SEED_DEFAULT_PREFERENCES:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
      VAULT_SECRET: PATH=secret/data/compositor
    depends_on:
      notifications-db:
        condition: service_healthy
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # OAM — Database (PostgreSQL)
  # ═══════════════════════════════════════════════════════════════════════════

  postgres-oam:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oam_user
      POSTGRES_PASSWORD: ${OAM_DB_PASSWORD:-oam_pass}
      POSTGRES_DB: oam_db
    volumes:
      - oam-postgres-data:/var/lib/postgresql/data
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oam_user -d oam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # OAM — Service (Rust / Axum)
  # ═══════════════════════════════════════════════════════════════════════════

  oam-service:
    build:
      context: ./oam-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://oam_user:${OAM_DB_PASSWORD:-oam_pass}@postgres-oam:5432/oam_db
      SERVER_ADDR: 0.0.0.0:8080
      FIRMWARE_STORAGE_PATH: /app/firmware_storage
      BASE_URL: ${OAM_BASE_URL:-http://oam.voltguard.pt}
      RUST_LOG: ${LOG_LEVEL:-info}
    volumes:
      - oam-firmware-storage:/app/firmware_storage
    depends_on:
      postgres-oam:
        condition: service_healthy
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # ANOMALY — Database (MongoDB)
  # ═══════════════════════════════════════════════════════════════════════════

  anomaly-db:
    image: mongo:7.0
    volumes:
      - anomaly-db-data:/data/db
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # ANOMALY — FastAPI (API)
  # ═══════════════════════════════════════════════════════════════════════════

  anomaly-api:
    build:
      context: ./anomaly-detection
      dockerfile: Dockerfile
    env_file:
      - ./anomaly-detection/.env
    environment:
      VG_MONGO_URI: mongodb://anomaly-db:27017/
      VG_MONGO_DB: voltguard
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
      VAULT_SECRET: PATH=secret/data/compositor
    depends_on:
      anomaly-db:
        condition: service_healthy
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/v1/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # KONG — API Gateway
  # ═══════════════════════════════════════════════════════════════════════════

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      # Admin API bound to loopback inside the container; not reachable from the host
      # unless re-exposed via docker-compose.override.yaml for debugging.
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_SSL_CERT: /etc/kong/certs/cert.pem
      KONG_SSL_CERT_KEY: /etc/kong/certs/key.pem
      KONG_LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "80:8000"    # public gateway — HTTP (kept for health checks)
      - "443:8443"   # public gateway — HTTPS (required for Keycloak PKCE)
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
      - ./kong/certs:/etc/kong/certs:ro
    depends_on:
      compositor-frontend:
        condition: service_healthy
      compositor-backend:
        condition: service_healthy
      oam-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      anomaly-api:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - voltguard-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  keycloak-data:
  notifications-db-data:
  anomaly-db-data:
  compositor-data:
  oam-postgres-data:
  oam-firmware-storage:

# ═══════════════════════════════════════════════════════════════════════════
# NETWORK
# ═══════════════════════════════════════════════════════════════════════════

networks:
  voltguard-network:
