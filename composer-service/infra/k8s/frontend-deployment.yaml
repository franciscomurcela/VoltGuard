apiVersion: apps/v1
kind: Deployment
metadata:
  name: compositor-frontend
  namespace: iot-platform
  labels:
    app: compositor-frontend
    component: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compositor-frontend
  template:
    metadata:
      labels:
        app: compositor-frontend
        component: frontend
    spec:
      containers:
        - name: compositor-frontend
          image: registry.example.com/iot-platform/compositor-frontend:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: compositor-frontend
  namespace: iot-platform
  labels:
    app: compositor-frontend
spec:
  selector:
    app: compositor-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
