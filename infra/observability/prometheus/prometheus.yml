global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'anomaly-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['anomaly-api:8085']

  - job_name: 'compositor-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['compositor-backend:8080']

  - job_name: 'notifications-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications-service:8083']

  - job_name: 'oam-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['oam-service:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'kong'
    metrics_path: /metrics
    static_configs:
      - targets: ['kong:8100']
