# COMPOSITOR — Frontend
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grupo4-compositor-frontend
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grupo4-compositor-frontend
  template:
    metadata:
      labels:
        app: grupo4-compositor-frontend
    spec:
      containers:
        - name: compositor-frontend
          image: registry.deti/grupo4-egs-deti.ua.pt/compositor-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: compositor-frontend
  namespace: tenant-grupo4-egs-deti-ua-pt
