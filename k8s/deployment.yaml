apiVersion: v1
kind: Service
metadata:
  name: postgres-keycloak
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  selector:
    app: grupo4-postgres-keycloak
  ports:
    - port: 5432
      targetPort: 5432

