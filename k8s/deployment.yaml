# KONG — ConfigMap
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: tenant-grupo4-egs-deti-ua-pt
data:
  kong.yml: |
    _format_version: "2.1"
    _transform: true

    services:
      - name: composer-backend
        url: http://compositor-backend:8080
        routes:
          - name: composer-api
            hosts:
              - grupo4-egs-deti.ua.pt
            paths:
              - /api
            strip_path: false

      - name: composer-frontend
        url: http://compositor-frontend:80
        routes:
          - name: composer-ui
            hosts:
              - grupo4-egs-deti.ua.pt
            paths:
              - /
            strip_path: false

      - name: oam-service
        url: http://oam-service:8080
        routes:
          - name: oam
            hosts:
              - grupo4-egs-deti.ua.pt
            paths:
              - /oam
            strip_path: true

      - name: notifications-service
        url: http://notifications-service:8083
        routes:
          - name: notifications
            hosts:
              - grupo4-egs-deti.ua.pt
            paths:
              - /notifications
            strip_path: true

      - name: anomaly-api
        url: http://anomaly-api:8085
        routes:
          - name: anomaly
            hosts:
              - grupo4-egs-deti.ua.pt
            paths:
              - /anomaly
            strip_path: true

      - name: keycloak
        url: http://keycloak:8080
        routes:
          - name: auth
            hosts:
              - grupo4-egs-deti.ua.pt
            paths:
              - /auth
            strip_path: false

