# ═══════════════════════════════════════════════════════════════════════════
# AUTH — Keycloak Database (PostgreSQL)
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grupo4-postgres-keycloak
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grupo4-postgres-keycloak
  template:
    metadata:
      labels:
        app: grupo4-postgres-keycloak
    spec:
      containers:
        - name: postgres-keycloak
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "keycloak_user"
            - name: POSTGRES_DB
              value: "keycloak_db"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voltguard-secrets
                  key: KEYCLOAK_DB_PASSWORD
          volumeMounts:
            - name: keycloak-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak_user", "-d", "keycloak_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak_user", "-d", "keycloak_db"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: keycloak-postgres-data
          persistentVolumeClaim:
            claimName: keycloak-postgres-data

