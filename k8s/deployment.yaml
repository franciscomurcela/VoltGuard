      containers:
        - name: anomaly-api
          image: registry.deti/grupo4-egs-deti.ua.pt/anomaly-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: VG_MONGO_URI
              value: ""
            - name: VG_MONGO_DB
              value: "voltguard"
            - name: VG_PERIODIC_INGESTION_ENABLED
              value: "0"
            - name: VG_INGESTION_INTERVAL_SECONDS
              value: "60"
            - name: VG_INGESTION_MODE
              value: "composer_push"
            - name: VG_COMPOSER_BASE_URL
              value: "http://compositor-backend:8080"
            - name: VG_COMPOSER_SENSORS_PATH
              value: "/v1/sensors"
            - name: VG_COMPOSER_MEASUREMENTS_PATH_TEMPLATE
              value: "/v1/sensors/{sensor_id}/measurements?limit={limit}"
            - name: VG_COMPOSER_DATASETS_POST_PATH
              value: "/v1/anomalies/datasets/push"
            - name: VG_COMPOSER_TIMEOUT_SECONDS
              value: "20"
            - name: VG_COMPOSER_WEBHOOK_URL
              value: "http://compositor-backend:8080/api/v1/anomalies/webhook"
            - name: VG_COMPOSER_MEASUREMENTS_LIMIT
              value: "500"
            - name: VG_DEFAULT_METRIC_NAME
              value: "voltage"
            - name: VG_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voltguard-secrets
                  key: VG_APP_TOKEN
            - name: VG_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: voltguard-secrets
                  key: VG_ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3

