# ═══════════════════════════════════════════════════════════════════════════
# AUTH — Keycloak
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grupo4-keycloak
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grupo4-keycloak
  template:
    metadata:
      labels:
        app: grupo4-keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start", "--import-realm"]
          ports:
            - containerPort: 8080
            - containerPort: 9000
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
            - name: KC_HOSTNAME
              value: "https://grupo4-egs-deti.ua.pt/auth"
            - name: KC_HOSTNAME_ADMIN
              value: "https://grupo4-egs-deti.ua.pt/auth"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: "10.0.0.0/8"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "postgres-keycloak"
            - name: KC_DB_URL_DATABASE
              value: "keycloak_db"
            - name: KC_DB_USERNAME
              value: "keycloak_user"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voltguard-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voltguard-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 150
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: keycloak-realm
          configMap:
            name: keycloak-realm

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  selector:
    app: grupo4-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: management
      port: 9000
      targetPort: 9000

---
# ═══════════════════════════════════════════════════════════════════════════
# KONG — API Gateway
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grupo4-kong
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grupo4-kong
  template:
    metadata:
      labels:
        app: grupo4-kong
    spec:
      containers:
        - name: kong
          image: kong:3.7
          ports:
            - containerPort: 8000
            - containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/etc/kong/kong.yml"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "127.0.0.1:8001"
            - name: KONG_LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
          readinessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: kong-config
          configMap:
            name: kong-config

---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  selector:
    app: grupo4-kong
  ports:
    - port: 8000
      targetPort: 8000

