# ═══════════════════════════════════════════════════════════════════════════
# NOTIFICATIONS — Database (MongoDB)
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grupo4-notifications-db
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grupo4-notifications-db
  template:
    metadata:
      labels:
        app: grupo4-notifications-db
    spec:
      containers:
        - name: notifications-db
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voltguard-secrets
                  key: NOTIFICATIONS_DB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "notifications_db"
          volumeMounts:
            - name: notifications-db-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --username admin --password $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\" --quiet"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: notifications-db-data
          persistentVolumeClaim:
            claimName: notifications-db-data

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-db
  namespace: tenant-grupo4-egs-deti-ua-pt
spec:
  selector:
    app: grupo4-notifications-db
  ports:
    - port: 27017
      targetPort: 27017

